name: Validate Kubernetes manifests

on:
  pull_request:

  push:
    branches:
      - main
    paths:
      - "manifests/**"
      - "argocd/**"
      - ".github/workflows/validate-manifests.yaml"

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: manifest-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate YAML and Kubernetes schemas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Install YAML linter
        run: pip install --disable-pip-version-check yamllint==1.37.1

      - name: Lint YAML files
        run: |
          yamllint \
            --config-data '{extends: default, rules: {document-start: disable, line-length: disable, truthy: {allowed-values: ["true", "false", "on"]}}}' \
            manifests argocd .github/workflows

      - name: Validate Kubernetes manifests
        run: |
          docker run --rm \
            --volume "${PWD}:/work" \
            ghcr.io/yannh/kubeconform:v0.7.0@sha256:85dbef6b4b312b99133decc9c6fc9495e9fc5f92293d4ff3b7e1b30f5611823c \
            -strict \
            -summary \
            /work/manifests
